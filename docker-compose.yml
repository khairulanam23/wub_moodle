services:

  db:

    image: mysql:8.4

    container_name: moodle-mysql

    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-allowed-packet=64M

    environment:

      MYSQL_DATABASE: ${MYSQL_DATABASE}

      MYSQL_USER: ${MYSQL_USER}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1" ]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 20s

  mariadb-backup:

    image: mariadb:11.8

    container_name: moodle-mariadb-backup

    restart: "no"

    profiles:
      - backup

    environment:

      MARIADB_DATABASE: ${MARIADB_DATABASE}

      MARIADB_USER: ${MARIADB_USER}

      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:

      - ./db:/var/lib/mysql

    healthcheck:

      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]

      interval: 5s

      timeout: 3s

      retries: 10

      start_period: 10s

  php:

    build:

      context: ./php

    image: moodle-php

    container_name: moodle-php

    restart: unless-stopped

    depends_on:

      db:

        condition: service_healthy

    volumes:

      - ./moodle:/var/www/html

      - ./moodledata:/var/www/moodledata

      - ./php/php.ini:/usr/local/etc/php/conf.d/moodle.ini:ro

  nginx:

    image: nginx:1.28-alpine

    container_name: moodle-nginx

    restart: unless-stopped

    depends_on:

      - php

    ports:

      - "0.0.0.0:8080:80"

    volumes:

      - ./moodle:/var/www/html:ro

      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  phpmyadmin:

    image: phpmyadmin:latest

    container_name: moodle-phpmyadmin

    restart: unless-stopped

    depends_on:

      db:

        condition: service_healthy

    environment:

      PMA_HOST: db

      PMA_PORT: 3306

      PMA_ARBITRARY: 0

    ports:

      - "0.0.0.0:8081:80"

    volumes:

      - ./phpmyadmin/themes/darkwolf:/var/www/html/themes/darkwolf:ro

  cron:

    build:

      context: ./php

    image: moodle-php

    container_name: moodle-cron

    restart: unless-stopped

    depends_on:

      db:

        condition: service_healthy

      php:

        condition: service_started

    user: www-data

    volumes:

      - ./moodle:/var/www/html

      - ./moodledata:/var/www/moodledata

      - ./php/php.ini:/usr/local/etc/php/conf.d/moodle.ini:ro

    command: >
      
      sh -c '

        sleep 5;

        while true; do

          php /var/www/html/admin/cli/cron.php

          sleep 60

        done

      '

volumes:
  mysql_data:
    name: moodle_mysql_data
